name: Packages (Varnish Enterprise)

# Builds native libvmod-tinykvm packages for every distro/architecture where
# Varnish Enterprise (varnish-plus) is published, in the same naming format as
# the enterprise sledge packages, e.g.
#   libvmod-tinykvm_1.0~6.0.18r2-1~noble_amd64.deb
#   libvmod-tinykvm-1.0~6.0.18r2-1.el9.x86_64.rpm
#
# Manual-only: this builds against Varnish Enterprise (varnish-plus) and is not
# meant to run on every push/PR. Trigger it from the Actions tab ("Run
# workflow") or with `gh workflow run`.
#
# The inputs mirror the CI workflows of the other enterprise VMODs (sledge,
# WAF), so a release is triggered the same way: tag the release commit
# v<vmod-version>-<VE-version> (e.g. v1.0-6.0.18r3), push the tag, and build it
# with install-from=staging, src-commit=<tag>, pkg-revision=1 and
# vcp-version=<VE-version>.
#
# Every run bundles the full set of packages into a single zip and attaches it
# to a draft GitHub release, so there is always a backup to review, download
# or publish from. Checking upload-to-staging also pushes the packages to the
# staging packagecloud repo.
on:
  workflow_dispatch:
    inputs:
      install-from:
        description: >-
          Where to get varnish-plus: production or staging. (The id of a
          varnish-cache-plus packaging run, which sledge and WAF accept, is
          not supported here.)
        type: string
        default: "production"
      src-commit:
        description: >-
          Branch, tag or SHA to build the packages from, e.g. the
          v<vmod-version>-<VE-version> release tag. Empty builds the branch
          selected above.
        type: string
        default: ""
      pkg-revision:
        description: >-
          Package revision, e.g. 1 for a release. Empty uses a build
          timestamp, marking the packages as a snapshot build.
        type: string
        default: ""
      vcp-version:
        description: >-
          varnish-plus version to build against, e.g. 6.0.18r3. It is
          installed from the install-from repo and goes into the package
          version. Empty takes the newest varnish-plus in that repo.
        type: string
        default: ""
      upload-to-staging:
        description: >-
          Also upload the packages to the staging packagecloud repo
          (requires pkg-revision). A draft release is created either way.
        type: boolean
        default: false

# Each dispatch gets a group of its own, as in sledge/WAF, since two
# dispatches may carry different inputs.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}

env:
  VCP_VERSION: ${{ inputs.vcp-version != '' && inputs.vcp-version || 'latest' }}

jobs:
  # Validate the inputs and settle the package revision once, so every package
  # in the run carries the same one.
  setup:
    name: Check inputs
    runs-on: ubuntu-24.04
    outputs:
      pkg-revision: ${{ steps.rev.outputs.pkg-revision }}
    steps:
      - name: Check inputs
        env:
          INSTALL_FROM: ${{ inputs.install-from }}
          PKG_REVISION: ${{ inputs.pkg-revision }}
          UPLOAD: ${{ inputs.upload-to-staging }}
        run: |
          case "$INSTALL_FROM" in
            production|staging) ;;
            *) echo "::error::install-from must be production or staging, got '$INSTALL_FROM'"; exit 1 ;;
          esac
          # A snapshot's timestamp revision sorts above a release's "1", so a
          # snapshot in staging would shadow the release packages.
          if [ "$UPLOAD" = true ] && [ -z "$PKG_REVISION" ]; then
            echo "::error::upload-to-staging requires pkg-revision (e.g. 1 for a release)"
            exit 1
          fi

      - name: Settle package revision
        id: rev
        env:
          PKG_REVISION: ${{ inputs.pkg-revision }}
        run: echo "pkg-revision=${PKG_REVISION:-$(date -u +%Y%m%d%H%M%S)}" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.target.label }} (${{ matrix.arch.name }})
    needs: setup
    runs-on: ${{ matrix.arch.runner }}
    container: ${{ matrix.target.image }}
    # When install-from is "staging", attach the "staging" environment so
    # ENTERPRISE_REPO / PACKAGECLOUD_TOKEN resolve to the private staging repo's
    # credentials. For "production" no environment is attached and
    # those secrets resolve to empty, so build-package.sh falls back to the
    # public production repo.
    environment: ${{ inputs.install-from == 'staging' && 'staging' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          # arm64 is temporarily disabled: TinyKVM does not support aarch64
          # yet, so the libkvm engine fails to build there. Re-enable once
          # TinyKVM gains ARM support.
          # - { name: arm64, runner: ubuntu-24.04-arm }
        target:
          # The distro set mirrors upstream varnish/varnish check.yml, narrowed
          # to where varnish-plus / varnish-plus-dev(el) actually ships.
          - { label: ubuntu-jammy,    family: deb, codename: jammy,    image: "ubuntu:22.04" }
          - { label: ubuntu-noble,    family: deb, codename: noble,    image: "ubuntu:24.04" }
          - { label: ubuntu-resolute, family: deb, codename: resolute, image: "ubuntu:26.04" }
          - { label: debian-bookworm, family: deb, codename: bookworm, image: "debian:bookworm" }
          - { label: debian-trixie,   family: deb, codename: trixie,   image: "debian:trixie" }
          - { label: almalinux-8,     family: rpm, dist: el8,          image: "almalinux:8" }
          - { label: almalinux-9,     family: rpm, dist: el9,          image: "almalinux:9" }
          - { label: almalinux-10,    family: rpm, dist: el10,         image: "almalinux:10" }
          - { label: amazonlinux-2023, family: rpm, dist: amzn2023,    image: "amazonlinux:2023" }
        exclude:
          # Moot while arm64 is disabled above, but kept for when ARM returns:
          # varnish-plus / varnish-plus-devel is not published for el8 on
          # aarch64 (only amd64), so the arm64 alma-8 build cannot resolve its
          # build dependencies. amd64 alma-8 still builds.
          - { arch: { name: arm64, runner: ubuntu-24.04-arm }, target: { label: almalinux-8, family: rpm, dist: el8, image: "almalinux:8" } }
    steps:
      # actions/checkout (and submodule fetch) needs git + certs present in the
      # bare distro images before it can run.
      - name: Install checkout prerequisites
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates
          else
            (command -v dnf >/dev/null 2>&1 && dnf install -y git ca-certificates) \
              || yum install -y git ca-certificates
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.src-commit }}
          submodules: recursive

      - name: Build package
        env:
          PKG_FAMILY: ${{ matrix.target.family }}
          PKG_CODENAME: ${{ matrix.target.codename }}
          PKG_DIST: ${{ matrix.target.dist }}
          VCP_VERSION: ${{ env.VCP_VERSION }}
          PKG_REVISION: ${{ needs.setup.outputs.pkg-revision }}
          # Empty in prod (no environment attached) -> public production repo.
          ENTERPRISE_REPO: ${{ secrets.ENTERPRISE_REPO }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          OUTDIR: ${{ github.workspace }}/packages
        run: packaging/ci/build-package.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: libvmod-tinykvm-${{ matrix.target.label }}-${{ matrix.arch.name }}
          path: packages/*
          if-no-files-found: error

  # ALWAYS: collect every distro/arch artifact into one zip and attach it to a
  # draft GitHub release, so the full set of .deb/.rpm packages can be reviewed
  # and published in one place. This runs on every build -- also when the
  # staging upload is requested (and even when that upload fails), so there is
  # always a complete backup of the built packages.
  release:
    name: Draft release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Check out the same ref we built from so the release can be targeted at
      # the exact commit (gh release --target needs a branch or full SHA).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.src-commit }}

      - name: Resolve target commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: libvmod-tinykvm-*
          merge-multiple: true

      # One zip with every .deb/.rpm, rather than one release asset per
      # package. merge-multiple above already flattened the per-job artifacts
      # into a single directory, and package filenames carry distro + arch, so
      # they cannot collide.
      - name: Bundle all packages into a single zip
        id: bundle
        run: |
          ls -l artifacts
          # VCP_VERSION is free text (the vcp-version input), so keep only
          # characters that are safe in a release asset filename.
          version="$(printf '%s' "$VCP_VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          zipname="libvmod-tinykvm-packages-${version}-build${{ github.run_number }}.zip"
          (cd artifacts && zip -j -q "../$zipname" *)
          unzip -l "$zipname"
          echo "zip=$zipname" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: packages-build-${{ github.run_number }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ZIP: ${{ steps.bundle.outputs.zip }}
        run: |
          cat > release-notes.md <<EOF
          Draft release with native libvmod-tinykvm packages for all supported
          Varnish Enterprise distros/architectures, built against Varnish
          Enterprise \`${VCP_VERSION}\` from ${TARGET_SHA}.

          Every package is bundled into a single archive: \`${ZIP}\`.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "libvmod-tinykvm packages (build ${{ github.run_number }}, VE ${{ env.VCP_VERSION }})" \
            --target "$TARGET_SHA" \
            --notes-file release-notes.md \
            "$ZIP"

  # OPT-IN, in addition to the draft release above: push the freshly built
  # packages up to the staging Varnish Enterprise packagecloud repo, so the new
  # (unreleased) version can be installed from staging for validation. Runs
  # only when upload-to-staging is checked.
  upload:
    name: Upload to staging
    if: ${{ inputs.upload-to-staging }}
    needs: package
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.src-commit }}

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: libvmod-tinykvm-*

      - name: Push packages to staging packagecloud
        env:
          # ENTERPRISE_REPO doubles as the push target (the staging repo we
          # installed from). PACKAGECLOUD_TOKEN must have push access.
          STAGING_REPO: ${{ secrets.ENTERPRISE_REPO }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: packaging/ci/upload-staging.sh
